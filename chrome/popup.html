    <div class="title" id="opensite">MEMOS</div>
    <!-- Instance switcher. The chip shows the active server and opens the list
         rendered by oper.js; the markup here is only the shell, because every
         row (name, host, state) comes from chrome.storage. -->
    <div id="instance_switcher" class="instance-switcher">
      <button
        id="instanceToggle"
        class="instance-toggle"
        type="button"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <span id="instanceDot" class="instance-dot" aria-hidden="true"></span>
        <span id="instanceName" class="instance-name"></span>
        <svg class="instance-caret" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div id="instanceMenu" class="instance-menu hidden" role="menu" aria-labelledby="instanceToggle">
        <div class="instance-menu-head">
          <span id="instanceMenuTitle" class="instance-menu-title"></span>
          <span id="instanceMenuCount" class="instance-menu-count"></span>
        </div>
        <div id="instanceList" class="instance-list"></div>
        <div class="instance-menu-actions">
          <button id="instanceAdd" class="instance-action" type="button"></button>
          <button id="instanceManage" class="instance-action" type="button"></button>
        </div>
      </div>
    </div>

         box, border and colour; they used to be absolutely positioned with
         hand-tuned right offsets, which is why they drifted apart. -->

        <svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">

        </svg>
      </button>
