name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundles:
    name: Bundle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unit checks (pure adapter helpers)
        run: node tools/verify/unit.mjs
      - name: Static checks (wiring, adapter parity, versions, locales)
        run: node tools/verify/bundles.mjs

  api-matrix:
    name: API matrix (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'all releases' || 'subset' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run container matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/verify/memos-api-matrix.mjs
          else
            node tools/verify/memos-api-matrix.mjs --only 0.15.0,0.23.1,0.26.1,0.31.0,26.10-rc.1
          fi
      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-matrix-report
          path: tools/verify/last-run.json
          if-no-files-found: ignore

  visibility-policy:
    name: Public visibility policy (greyed-out option)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Chrome for Testing
        run: npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"
      - name: Start Memos 0.26.1 with public memos disabled
        run: |
          docker run -d --name memos-lock -p 15402:5230 neosmemo/memos:0.26.1
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:15402/api/v1/instance/profile >/dev/null; then sleep 2; exit 0; fi
            sleep 1
          done
          docker logs memos-lock
          exit 1
      - name: Enable disallowPublicVisibility
        run: |
          BASE=http://127.0.0.1:15402/api/v1
          curl -sf -X POST "$BASE/users" -H 'Content-Type: application/json'             -d '{"username":"tester","password":"Passw0rd!123","role":"ADMIN"}' >/dev/null
          TOKEN=$(curl -sf -X POST "$BASE/auth/signin" -H 'Content-Type: application/json'             -d '{"passwordCredentials":{"username":"tester","password":"Passw0rd!123"}}' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).accessToken))")
          curl -sf -X PATCH "$BASE/instance/settings/MEMO_RELATED?updateMask=memoRelatedSetting"             -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'             -d '{"name":"instance/settings/MEMO_RELATED","memoRelatedSetting":{"disallowPublicVisibility":true,"contentLengthLimit":8192}}' >/dev/null
          echo "MEMOS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Adapter matrix with the restriction on
        run: node tools/verify/memos-api-matrix.mjs --only 0.26.1 --disallow-public
      - name: Popup greys out PUBLIC and refuses selection
        run: |
          CHROME=$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -1)
          test -x "$CHROME"
          CHROME_PATH="$CHROME" node tools/verify/chrome-ui.mjs \
            --url http://127.0.0.1:15402/ --token "$MEMOS_TOKEN" --scenario locked-public

  background:
    name: Context menus and command (live service worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Chrome for Testing
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"
          CHROME_PATH=$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -1)
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Attach to the real service worker
        run: node tools/verify/background-live.mjs

  firefox-smoke:
    name: Firefox install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Firefox
        run: npx --yes @puppeteer/browsers install firefox@stable --path "$RUNNER_TEMP/ff"
      - name: Lint with the AMO validator
        run: npx --yes web-ext lint --source-dir firefox
      - name: Install bundle into real Firefox (BiDi)
        run: |
          FIREFOX_PATH=$(find "$RUNNER_TEMP/ff" -type f -name firefox | head -1)
          test -x "$FIREFOX_PATH"
          FIREFOX_PATH="$FIREFOX_PATH" node tools/verify/firefox-smoke.mjs

  browser-ui:
    name: Popup UI (Chrome ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: root
            extra: ''
          - label: sub-path
            extra: '--subpath /memos'
          - label: edge-bundle
            extra: '--extension edge'
          - label: upload
            extra: '--scenario upload'
          - label: mobile
            extra: '--mobile'
          - label: resize
            extra: '--scenario resize'
          - label: drop-multi
            extra: '--scenario drop-multi'
          - label: fullscreen
            extra: '--page=popup.html?mode=full --viewport 1280x800 --scenario fullscreen-layout'
          - label: fullscreen-panel
            extra: '--page=popup.html?mode=full --viewport 1440x900 --scenario fullscreen-panel'
          - label: drop-text
            extra: '--scenario drop-text'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Start Memos
        run: |
          docker run -d --name memos -p 15400:5230 neosmemo/memos:0.31.0
          for _ in $(seq 1 90); do
            # 0.24+ removed /api/v1/status; /instance/profile and the SPA both work.
            if curl -sf http://127.0.0.1:15400/api/v1/instance/profile >/dev/null \
              || curl -sf http://127.0.0.1:15400/ >/dev/null; then
              sleep 2
              exit 0
            fi
            sleep 1
          done
          docker logs memos
          exit 1

      - name: Provision user and token
        run: |
          curl -sf -X POST http://127.0.0.1:15400/api/v1/users \
            -H 'Content-Type: application/json' \
            -d '{"username":"tester","password":"Passw0rd!123","role":"ADMIN"}'
          TOKEN=$(curl -sf -X POST http://127.0.0.1:15400/api/v1/auth/signin \
            -H 'Content-Type: application/json' \
            -d '{"passwordCredentials":{"username":"tester","password":"Passw0rd!123"}}' | jq -r .accessToken)
          test -n "$TOKEN"
          echo "MEMOS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Chrome for Testing
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"
          CHROME_PATH=$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -1)
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Drive the real popup
        run: |
          node tools/verify/chrome-ui.mjs \
            --url http://127.0.0.1:15400/ \
            --token "$MEMOS_TOKEN" \
            --text "ci-${{ matrix.label }}-${{ github.run_id }}" \
            ${{ matrix.extra }}

      - name: Stop Memos
        if: always()
        run: docker rm -f memos || true
